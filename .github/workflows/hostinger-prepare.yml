name: Hostinger - reconcile dependencies and verify types

on:
  push:
    branches:
      - hostinger-business-adaptacao
    paths:
      - package.json
      - src/payload.config.ts
      - tsconfig.json
      - scripts/hostinger-build.mjs
      - src/seed/if-empty.ts
      - src/migrations/**
      - scripts/ci-verify-r2.ts
      - .github/workflows/hostinger-prepare.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: hostinger-business-adaptacao
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate consistent npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize lockfile for Payload R2 adapter"
            git push origin HEAD:hostinger-business-adaptacao
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate route types for Next.js 16
        env:
          R2_BUCKET: placeholder-bucket
          R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
        run: npx next typegen

      - name: Check TypeScript without contacting production databases
        run: npx tsc --noEmit

      - name: Lint source
        run: npm run lint

  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vialumina
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: vialumina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vialumina -d vialumina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://vialumina:test-only@localhost:5432/vialumina
      PAYLOAD_SECRET: integration-test-only-hostinger-build
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      R2_BUCKET: placeholder-bucket
      R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: placeholder
      R2_SECRET_ACCESS_KEY: placeholder
      NODE_ENV: production
      NODE_OPTIONS: --no-deprecation --max-old-space-size=2048
      DATABASE_URL_UNPOOLED: postgres://vialumina:test-only@localhost:5432/vialumina
      HOSTINGER_CI_SKIP_SEED_FOR_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run versioned migrations against test Postgres
        run: npm run migrate
      - name: Verify storage schema queries with R2 adapter enabled
        run: npm run payload -- run scripts/ci-verify-r2.ts
      - name: Run Hostinger standard build command on disposable database
        run: npm run build
