name: Hostinger - reconcile dependencies and verify types

on:
  push:
    branches:
      - hostinger-business-adaptacao
    paths:
      - package.json
      - src/payload.config.ts
      - tsconfig.json
      - .github/workflows/hostinger-prepare.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: hostinger-business-adaptacao
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate consistent npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize lockfile for Payload R2 adapter"
            git push origin HEAD:hostinger-business-adaptacao
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript without contacting production databases
        run: npx tsc --noEmit

      - name: Lint source
        run: npm run lint
