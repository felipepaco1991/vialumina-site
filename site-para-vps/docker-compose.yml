# Banco de dados para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vialumina
      POSTGRES_PASSWORD: vialumina
      POSTGRES_DB: vialumina
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vialumina']
      interval: 5s
      retries: 10

volumes:
  pgdata:
